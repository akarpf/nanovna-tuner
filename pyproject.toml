[project]
name = "nanovna-tuner"
dynamic = ["version"]
description = "Live NanoVNA SWR measurements served to any browser/phone on the local network"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyserial>=3.5",
    "segno>=1.6.6",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
nanovna-tuner = "nanovna_tuner.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "nanovna_tuner/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
